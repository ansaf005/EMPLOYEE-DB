    // Load local environment config from .env at runtime
    window.supabaseConfig = null;

    async function initSupabaseConfig() {
      try {
        const res = await fetch('/.env?t=' + Date.now());
        if (!res.ok) throw new Error();
        const text = await res.text();
        const config = {};
        text.split('\n').forEach(line => {
          const parts = line.split('=');
          if (parts.length >= 2) {
            const key = parts[0].trim();
            const val = parts.slice(1).join('=').trim();
            config[key] = val;
          }
        });
        const url = (config.VITE_SUPABASE_URL || config.SUPABASE_URL || 'https://nfxwhudqwezjgcisegez.supabase.co').replace(/\/rest\/v1\/?$/, '');
        const key = config.VITE_SUPABASE_ANON_KEY || config.SUPABASE_ANON_KEY || 'sb_publishable_6kCFq7bkASiKQ9gp8r0Uww_14FHfrQY';
        window.supabaseConfig = { url, key };
        if (window.supabase) {
          window.supabaseClient = window.supabase.createClient(url, key);
        }
      } catch (e) {
        console.warn("Could not parse .env, using default credentials", e);
        const url = 'https://nfxwhudqwezjgcisegez.supabase.co';
        const key = 'sb_publishable_6kCFq7bkASiKQ9gp8r0Uww_14FHfrQY';
        window.supabaseConfig = { url, key };
        if (window.supabase) {
          window.supabaseClient = window.supabase.createClient(url, key);
        }
      }
    }
    
    // Blocking configuration load
    window.configPromise = initSupabaseConfig();
  </script>

          } else {
            // Supabase auth subscription listener

              client.auth.getSession().then(({ data: { session: activeSession } }) => {
                setSession(activeSession);
                if (activeSession) fetchUserProfile(activeSession.user.id);
              });
              client.auth.onAuthStateChange((_event, activeSession) => {
                setSession(activeSession);
                if (activeSession) {
                  fetchUserProfile(activeSession.user.id);
                } else {
                  setCurrentUser(null);
                }
              });
            }
          }
        });
      }, []);

        const client = window.supabaseClient;
        if (!client) return;
        try {
          const { data, error } = await client.from('profiles').select('*').eq('id', userId).single();
          if (error) throw error;
          if (data) {
            setCurrentUser(data);
          }
        } catch (err) {
          console.warn("Profile fetch error, auto-provisioning...", err);
          // Auto-provision profile from auth metadata
          const mockUser = INITIAL_EMPLOYEES.find(e => e.email.toLowerCase() === session?.user?.email?.toLowerCase());

            id: userId,
            name: mockUser?.name || 'Administrator',
            email: session?.user?.email || 'admin@company.com',

            status: 'active',

          setCurrentUser(newProfile);
        }

        if (!configLoaded) return;

    // --- Sub-View: Time Clock (Employee Punch Card) ---
    const TimecardView = ({ currentUser, isOfflineMode }) => {
      const [clockRecord, setClockRecord] = useState(null);
      const [logs, setLogs] = useState([]);
      const [time, setTime] = useState('');
      const [sessionHours, setSessionHours] = useState('0.00 hrs');
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        const interval = setInterval(() => {
          setTime(new Date().toTimeString().split(' ')[0]);
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        if (!clockRecord) {
          setSessionHours('0.00 hrs');
          return;
        }
        const [inH, inM, inS] = clockRecord.clock_in.split(':').map(Number);
        const inDate = new Date();
        inDate.setHours(inH, inM, inS);

        const interval = setInterval(() => {
          const now = new Date();
          const diffMs = now.getTime() - inDate.getTime();
          const hours = diffMs / (1000 * 60 * 60);
          setSessionHours(`${hours.toFixed(2)} hrs`);
        }, 1000);

        return () => clearInterval(interval);
      }, [clockRecord]);

      const fetchLogs = async () => {
        setLoading(true);
        if (isOfflineMode) {
          const localData = localStorage.getItem('emp_react_attendance');
          const allLogs = localData ? JSON.parse(localData) : [];
          const userLogs = allLogs.filter(l => l.employee_id === currentUser.id);
          setLogs(userLogs);
          const todayStr = new Date().toISOString().split('T')[0];
          const active = userLogs.find(l => l.date === todayStr && !l.clock_out);
          setClockRecord(active || null);
        } else {
          const client = window.supabaseClient;
          if (client) {
            const { data } = await client
              .from('attendance')
              .select('*')
              .eq('employee_id', currentUser.id)
              .order('date', { ascending: false });
            if (data) {
              setLogs(data);
              const todayStr = new Date().toISOString().split('T')[0];
              const active = data.find(l => l.date === todayStr && !l.clock_out);
              setClockRecord(active || null);
            }
          }
        }
        setLoading(false);
      };

      useEffect(() => {
        fetchLogs();
      }, [currentUser.id]);

      const handleClockAction = async () => {
        setLoading(true);
        const todayStr = new Date().toISOString().split('T')[0];
        const now = new Date();
        const timeStr = now.toTimeString().split(' ')[0];

        if (clockRecord) {
          // Clock out
          const [inH, inM, inS] = clockRecord.clock_in.split(':').map(Number);
          const inDate = new Date();
          inDate.setHours(inH, inM, inS);
          const diffMs = now.getTime() - inDate.getTime();
          const hours = parseFloat((diffMs / (1000 * 60 * 60)).toFixed(2));

          if (isOfflineMode) {
            const localData = localStorage.getItem('emp_react_attendance');
            let allLogs = localData ? JSON.parse(localData) : [];
            allLogs = allLogs.map(l => l.id === clockRecord.id ? { ...l, clock_out: timeStr, hours_worked: hours } : l);
            localStorage.setItem('emp_react_attendance', JSON.stringify(allLogs));
            alert(`Clocked out successfully. Hours worked: ${hours}`);
            fetchLogs();
          } else {
            const client = window.supabaseClient;
            if (client) {
              await client.from('attendance').update({ clock_out: timeStr, hours_worked: hours }).eq('id', clockRecord.id);
              alert(`Clocked out successfully. Hours worked: ${hours}`);
              fetchLogs();
            }
          }
        } else {
          // Clock in
          const [hours, minutes] = timeStr.split(':').map(Number);
          const isLate = hours > 9 || (hours === 9 && minutes > 5);
          const status = isLate ? 'Late' : 'On Time';

          const newRecord = {
            id: `att-${Date.now()}`,
            employee_id: currentUser.id,
            date: todayStr,
            clock_in: timeStr,
            clock_out: null,
            hours_worked: 0,
            status: status
          };

          if (isOfflineMode) {
            const localData = localStorage.getItem('emp_react_attendance');
            const allLogs = localData ? JSON.parse(localData) : [];
            allLogs.push(newRecord);
            localStorage.setItem('emp_react_attendance', JSON.stringify(allLogs));
            alert(`Clocked in successfully (${status}).`);
            fetchLogs();
          } else {
            const client = window.supabaseClient;
            if (client) {
              const { id, ...dbInsertData } = newRecord;
              await client.from('attendance').insert(dbInsertData);
              alert(`Clocked in successfully (${status}).`);
              fetchLogs();
            }
          }
        }
        setLoading(false);
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
          <div className="lg:col-span-5 bg-white border border-neutral-100 dark:bg-neutral-950 dark:border-neutral-900 p-6 rounded-2xl shadow-soft text-center space-y-6 relative overflow-hidden">
            <div className="absolute top-0 left-0 right-0 h-1 bg-neutral-200 dark:bg-neutral-800">
              {clockRecord && <div className="h-full bg-black dark:bg-white animate-pulse" style={{ width: '100%' }}></div>}
            </div>
            
            <div className="space-y-1">
              <span className="text-[10px] font-bold uppercase tracking-wider text-neutral-400">Digital Clock</span>
              <div className="text-3xl font-bold font-mono tracking-tight">{time || '00:00:00'}</div>
            </div>

            <div className="flex flex-col items-center justify-center py-4">
              <button
                onClick={handleClockAction}
                disabled={loading}
                className={`w-24 h-24 rounded-full border flex flex-col items-center justify-center gap-1.5 transition-all shadow-md focus:outline-none ${clockRecord ? 'border-neutral-800 text-neutral-800 hover:bg-neutral-50 dark:border-white dark:text-white dark:hover:bg-neutral-900' : 'border-black bg-black text-white hover:bg-neutral-900 dark:border-white dark:bg-white dark:text-black dark:hover:bg-neutral-100'}`}
              >
                <LucideIcon name={clockRecord ? "square" : "play"} size={16} />
                <span className="text-[9px] font-bold uppercase tracking-wider">{clockRecord ? 'Clock Out' : 'Clock In'}</span>
              </button>
            </div>

            <div className="text-xs font-medium space-y-1.5 border-t border-neutral-50 dark:border-neutral-900/50 pt-4">
              <div className="flex justify-between text-neutral-400">
                <span>Shift Status</span>
                <span className={`font-bold ${clockRecord ? 'text-neutral-900 dark:text-white' : 'text-neutral-400'}`}>
                  {clockRecord ? (clockRecord.status === 'Late' ? 'Late Active' : 'Active Shift') : 'Punch Clock Out'}
                </span>
              </div>
              <div className="flex justify-between text-neutral-400">
                <span>Worked Session</span>
                <span className="font-mono font-bold text-neutral-900 dark:text-white">{sessionHours}</span>
              </div>
            </div>
          </div>

          <div className="lg:col-span-7 bg-white border border-neutral-100 dark:bg-neutral-950 dark:border-neutral-900 p-5 rounded-2xl shadow-soft space-y-4">
            <h3 className="font-heading font-bold text-xs uppercase tracking-wider text-neutral-400">Attendance Log History</h3>
            <div className="overflow-x-auto text-[11px]">
              <table className="w-full text-left border-collapse select-none">
                <thead>
                  <tr className="text-neutral-400 font-bold border-b border-neutral-100 dark:border-neutral-900">
                    <th className="pb-2">Date</th>
                    <th className="pb-2">Clock In</th>
                    <th className="pb-2">Clock Out</th>
                    <th className="pb-2">Worked</th>
                    <th className="pb-2">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-neutral-50 dark:divide-neutral-900/40">
                  {logs.length === 0 ? (
                    <tr>
                      <td colSpan={5} className="py-8 text-center text-neutral-400">No shift logs found.</td>
                    </tr>
                  ) : (
                    logs.map(log => (
                      <tr key={log.id} className="text-neutral-500">
                        <td className="py-2.5 font-medium">{log.date}</td>
                        <td className="py-2.5 font-mono">{log.clock_in}</td>
                        <td className="py-2.5 font-mono">{log.clock_out || <span className="text-neutral-900 dark:text-white font-semibold italic">Active</span>}</td>
                        <td className="py-2.5">{log.hours_worked ? `${log.hours_worked} hrs` : '-'}</td>
                        <td className="py-2.5"><span className="px-2 py-0.5 rounded-full border text-[9px]">{log.status}</span></td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    // --- Sub-View: Settings ---
    const SettingsView = ({ employees, onReset, isOfflineMode }) => {
      return (
        <div className="max-w-md mx-auto space-y-4">
          <div className="bg-white border rounded-2xl p-5 dark:bg-neutral-950 dark:border-neutral-900 space-y-2 text-xs">
            <h4 className="text-xs uppercase font-bold text-neutral-400">Database Connection</h4>
            <p className="text-neutral-400">Total profiles loaded: {employees.length}</p>
            <p className="text-neutral-400">Active engine: <strong className="text-neutral-900 dark:text-white font-semibold">{isOfflineMode ? 'LocalStorage Cache' : 'Supabase Cloud REST Driver'}</strong></p>
          </div>
          <div className="bg-white border border-red-100 dark:border-red-950/40 rounded-2xl p-5 dark:bg-neutral-950 space-y-3">
            <h4 className="text-xs uppercase font-bold text-red-500">Danger Zone</h4>
            <button onClick={onReset} className="w-full border border-red-200 text-red-500 hover:bg-red-50 py-2 rounded-xl text-xs font-semibold dark:border-red-950 dark:hover:bg-red-950/20">Reset System Database</button>
          </div>
        </div>
      );
    };

    // Bootstrap React App
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
